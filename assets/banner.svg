<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/><stop offset="1" stop-color="#120a24"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
    .d { fill: #1b2440; animation: probe 7.40s linear infinite; }
    .p { --on: #22d3ee; } .f { --on: #d946ef; }
    @keyframes probe { 0% { fill: #1b2440; } 1.5% { fill: #ffffff; } 3%, 92% { fill: var(--on); } 100% { fill: #1b2440; } }
    .t { fill: none; stroke: url(#ink); stroke-width: 2; stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 3s ease-out forwards; }
    .t2 { animation-delay: .4s; } .t3 { animation-delay: .8s; } .t4 { animation-delay: 1.2s; } .t5 { animation-delay: 1.6s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .pulse { fill: #fff; filter: url(#blur); animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    .fade { opacity: 0; animation: in 1s ease-out forwards; }
    @keyframes in { to { opacity: 1; } }
    .cur { animation: cur 1s steps(1) infinite; } @keyframes cur { 50% { opacity: 0; } }
    .spin { transform-origin: 190px 170px; animation: spin 24s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <circle cx="190" cy="170" r="188" fill="url(#glow)"/>

